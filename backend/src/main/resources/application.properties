# =============================================================================
# TextToSpeechAI Backend Configuration
# =============================================================================

server.port=8080

# --- CORS ---
# Comma-separated list of allowed origins for the Angular frontend
cors.allowed-origins=http://localhost:4200

# --- Jsoup ---
# Timeout in milliseconds for HTTP requests
jsoup.timeout=10000
# Maximum number of characters extracted from a chapter
jsoup.max-text-length=100000

# --- ElevenLabs TTS (optional) ---
# Obtain a free API key at https://elevenlabs.io
# Leave blank to skip ElevenLabs and fall back to the next engine
elevenlabs.api-key=

# --- Google Cloud TTS (optional) ---
# Obtain an API key at https://console.cloud.google.com/apis/credentials
# The Text-to-Speech API must be enabled in your project
# Leave blank to skip Google TTS
google.tts.api-key=

# --- Logging ---
logging.level.com.tts=INFO
